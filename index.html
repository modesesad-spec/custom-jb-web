<!<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 JAILBREAK HUB</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔓</text></svg>">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-unlock-alt"></i>
                <h1 id="app-title">🔥 JAILBREAK HUB</h1>
            </div>
            <p class="subtitle" id="app-subtitle">v3.0 - Ultimate Prompt Generator</p>
            <div class="dev-badge" id="dev-info">
                <i class="fas fa-code"></i> Developer: <span id="dev-name">Sanzmodz</span>
            </div>
        </header>

        <main>
            <div class="control-panel">
                <div class="grid">
                    <div class="input-group">
                        <label><i class="fas fa-robot"></i> Target AI</label>
                        <select id="ai-select"></select>
                    </div>
                    <div class="input-group">
                        <label><i class="fas fa-cogs"></i> Mode</label>
                        <select id="mode-select"></select>
                    </div>
                    <div class="input-group">
                        <label><i class="fas fa-palette"></i> Style</label>
                        <select id="style-select"></select>
                    </div>
                    <div class="input-group">
                        <label><i class="fas fa-key"></i> Token Type</label>
                        <select id="token-select"></select>
                    </div>
                </div>

                <div class="input-group">
                    <label><i class="fas fa-edit"></i> Custom Prompt (Optional)</label>
                    <textarea id="custom-prompt" placeholder="Ketik prompt custom di sini..."></textarea>
                </div>

                <div class="button-grid">
                    <button id="generate-btn" class="btn btn-primary">
                        <i class="fas fa-bolt"></i> GENERATE PROMPT
                    </button>
                    <button id="random-btn" class="btn btn-secondary">
                        <i class="fas fa-random"></i> RANDOM ALL
                    </button>
                    <button id="reset-btn" class="btn btn-danger">
                        <i class="fas fa-redo"></i> RESET
                    </button>
                </div>
            </div>

            <div class="output-panel">
                <div class="panel-header">
                    <h3><i class="fas fa-code"></i> Generated Prompt</h3>
                    <div class="actions">
                        <button id="copy-btn" class="btn-action"><i class="fas fa-copy"></i> Copy</button>
                        <button id="encode-btn" class="btn-action"><i class="fas fa-lock"></i> Encode</button>
                        <button id="save-btn" class="btn-action"><i class="fas fa-save"></i> Save</button>
                    </div>
                </div>
                <textarea id="output-area" readonly></textarea>
                <div class="token-info">
                    <span><i class="fas fa-key"></i> Token: <code id="token-display">-</code></span>
                    <span><i class="fas fa-anchor"></i> Anchor: <code id="anchor-display">-</code></span>
                    <span><i class="fas fa-door-closed"></i> Exit: <code id="exit-display">-</code></span>
                </div>
            </div>

            <div class="history-panel">
                <h3><i class="fas fa-history"></i> Recent Prompts</h3>
                <div id="history-list"></div>
            </div>
        </main>

        <footer>
            <div class="footer-content">
                <p id="version-info">Version: 3.0</p>
                <p class="warning"><i class="fas fa-exclamation-triangle"></i> For educational and testing purposes only.</p>
                <p class="credit" id="credit-text">🔥 JAILBREAK HUB © 2024</p>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
